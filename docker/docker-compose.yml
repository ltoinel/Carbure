# Carbure with MariaDB, from the docker/ directory: docker compose up -d, then open
# http://localhost:8080/ and follow the installation wizard (everything is filled in).
# Optional: choose the database password in docker/.env (DB_PASSWORD=...).
# The data of Carbure (configuration, logs, banks) is in the data/ directory of the project.
services:
  carbure:
    image: ghcr.io/ltoinel/carbure:latest
    build:
      # The build context is the root of the project
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: carbure
      DB_USER: carbure
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      # Language suggested by the installation wizard (fr, en)
      LANGUAGE: fr
      # Daily bank synchronization (seconds); remove to disable
      SYNC_INTERVAL: 86400
    volumes:
      - ../data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: carbure
      MARIADB_USER: carbure
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - carbure-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  carbure-db:
