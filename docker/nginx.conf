# Access log without the secrets of the URL: the sync token (?token=, deprecated, for
# the schedulers not migrated to the X-Sync-Token header), the token of the MCP server
# (?token=) and the OAuth secrets (access_token, code) are replaced by ***. Two passes:
# up to two secrets in one URL. Same fields as the "main" format of the image otherwise.
map $request $carbure_request_1 {
    "~*^(?<pre>.*?[?&](?:token|access_token|code)=)[^&\s]*(?<post>.*)$" "${pre}***${post}";
    default $request;
}
map $carbure_request_1 $carbure_request {
    "~*^(?<pre>.*?[?&](?:token|access_token|code)=)(?!\*\*\*(?:[&\s]|$))[^&\s]*(?<post>.*)$" "${pre}***${post}";
    default $carbure_request_1;
}
log_format carbure '$remote_addr - $remote_user [$time_local] "$carbure_request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';

# The successful health checks (GET /api/health: Docker HEALTHCHECK, supervision tools,
# mobile apps) are not written in the access log: one line every few minutes that says
# nothing. Their errors (4xx, 5xx) are still written, like every other request.
map "$uri:$status" $carbure_loggable {
    "~^/api/health:[123]\d\d$" 0;
    default 1;
}

# Rate limit of the login routes (POST /api/user/login, /api/user/login/mfa,
# /api/oauth/token): 30 requests per minute per client address, besides the lock of an
# account after 5 failed logins (User.php), which does not slow down attempts spread over
# many accounts. The address is the one of the client behind a trusted reverse proxy
# (TRUSTED_PROXIES, see below), else the whole household would share the limit of the proxy.
limit_req_zone $binary_remote_addr zone=carbure_login:10m rate=30r/m;

# Carbure: the portal, Swagger and the API are the only public paths
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    root /var/www/carbure;
    access_log /var/log/nginx/access.log carbure if=$carbure_loggable;

    # Address of the client behind the trusted reverse proxies (TRUSTED_PROXIES: private
    # networks and loopback by default), from X-Forwarded-For: used by the rate limit, the
    # access log and PHP (REMOTE_ADDR). Written at each start by docker/entrypoint.sh
    # (docker/nginx-real-ip.sh); without it (other entrypoint), the address of the connection.
    include /run/carbure/nginx-real-ip*.conf;

    client_max_body_size 2m;

    # Relative redirects: the container listens on 80 but is published on another
    # port (8080) or behind a proxy, so an absolute Location would lose the port.
    absolute_redirect off;

    # Security headers of the portal and Swagger (the API sets its own, see
    # Webservice::securityHeaders).
    # Vue compiles the templates of the page in the browser: 'unsafe-eval' is needed.
    # No external CDN: every script, style, font and image is served with the project
    # (portal/vendor, swagger/vendor), and the portal only calls its own API ('self').
    # HSTS belongs to the HTTPS reverse proxy in front of the container.
    set $csp_portal "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Home -> portal
    location = / {
        return 302 /portal/;
    }

    # Static files of the portal, with the texts of each language (portal/i18n/<locale>.json,
    # application/json from mime.types, fetched by i18n.js from the same origin)
    location /portal/ {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy $csp_portal always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Web App Manifest (the portal installed as an app): its media type is missing
        # from the mime.types of nginx. Same security headers (inherited from above).
        location ~ \.webmanifest$ {
            types { application/manifest+json webmanifest; }
        }
    }

    # OpenAPI description of the API, generated by PHP (never served as a file)
    location = /swagger/swagger.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/swagger/swagger.php;
        fastcgi_param SCRIPT_NAME /swagger/swagger.php;
        fastcgi_pass 127.0.0.1:9000;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /swagger/ {
        try_files $uri $uri/ =404;
        # Swagger UI is served with the project (swagger/vendor): nothing from another site.
        # Framed by the portal only (Administration > API): same origin, never another site.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # API: every /api/... request is handled by src/api.php
    # OAuth metadata of the MCP server (AI agents connectors), answered by the API
    location ^~ /.well-known/oauth- {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/src/api.php;
        fastcgi_param SCRIPT_NAME /src/api.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location /api/ {
        include /etc/nginx/carbure/api.conf;
    }

    # Login routes: the API as above, at most 30 requests per minute per client (burst of
    # 10 at once, e.g. a password then the code of the second factor), then 429 for a while.
    # nginx matches the decoded and normalized path (//, %XX, ./): PHP routes the raw one
    # exactly, so another spelling of these paths is not routed (404).
    location ~ ^/api/(?:user/login(?:/mfa)?|oauth/token)$ {
        limit_req zone=carbure_login burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @carbure_too_many_logins;
        include /etc/nginx/carbure/api.conf;
    }

    # The 429 of the rate limit, in the format of the errors of the API
    location @carbure_too_many_logins {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 429 '{"error":"Too many login attempts, try again in a minute","code":429}';
    }

    # Import of a backup (Administration > Backup, administrators): the rows of the
    # datasets in JSON, larger than the other requests
    location = /api/backup/import {
        client_max_body_size 32m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/src/api.php;
        fastcgi_param SCRIPT_NAME /src/api.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 600s;
        gzip off;
    }

    # Everything else (configuration, logs, sources, SQL...) is never served
    location / {
        return 404;
    }
}
