# Carbure: the portal, Swagger and the API are the only public paths
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    root /var/www/carbure;

    client_max_body_size 2m;

    # Security headers of the portal and Swagger (the API sets its own, see
    # Webservice::securityHeaders).
    # Vue compiles the templates of the page in the browser: 'unsafe-eval' is needed.
    # HSTS belongs to the HTTPS reverse proxy in front of the container.
    set $csp_portal "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Home -> portal
    location = / {
        return 302 /portal/;
    }

    location /portal/ {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy $csp_portal always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location /swagger/ {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # API: every /api/... request is handled by src/api.php
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/src/api.php;
        fastcgi_param SCRIPT_NAME /src/api.php;
        fastcgi_pass 127.0.0.1:9000;
        # The synchronization is long and streamed (Server-Sent Events)
        fastcgi_read_timeout 3600s;
        fastcgi_buffering off;
        gzip off;
    }

    # Everything else (configuration, logs, sources, SQL...) is never served
    location / {
        return 404;
    }
}
