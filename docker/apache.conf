# Carbure: the portal, Swagger and the API are the only public paths
<VirtualHost *:80>
    DocumentRoot /var/www/carbure
    ServerSignature Off

    <Directory /var/www/carbure>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/carbure/portal>
        Require all granted
    </Directory>

    <Directory /var/www/carbure/swagger>
        Require all granted
    </Directory>

    <Directory /var/www/carbure/src>
        <Files "api.php">
            Require all granted
        </Files>
    </Directory>

    RewriteEngine On
    # Home -> portal
    RewriteRule ^/$ /portal/ [R=302,L]
    # API: every /api/... request is handled by src/api.php
    RewriteRule ^/api/ /var/www/carbure/src/api.php [L]

    # Server-Sent Events of the synchronization must not be buffered or compressed
    SetEnvIf Request_URI "^/api/bank/sync" no-gzip=1

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
