# Settings of the API (/api/...: src/api.php), included by the locations of docker/nginx.conf
# that serve it (/api/ and the rate-limited login routes), so that they behave the same.
# Copied by docker/Dockerfile to /etc/nginx/carbure/api.conf (not in http.d/, which nginx
# reads as server configurations).
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root/src/api.php;
fastcgi_param SCRIPT_NAME /src/api.php;
fastcgi_pass 127.0.0.1:9000;
# The synchronization is long and streamed (Server-Sent Events)
fastcgi_read_timeout 3600s;
fastcgi_buffering off;
gzip off;
