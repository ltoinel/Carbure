name: PR title

# The pull requests are squash-merged: their title becomes the commit of main. It must
# follow Conventional Commits (see CONTRIBUTING.md).
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      # Only reads the title of the PR: no code of the PR is checked out
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            security
            perf
            refactor
            docs
            test
            ci
            chore
            build
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The description "{subject}" must start with a lowercase letter and must not end with a period.
