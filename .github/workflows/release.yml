name: Release

# Started by pushing a tag (git tag v1.2.0 && git push origin v1.2.0): CI, Docker image,
# then the release is created with its archives and generated notes in one go. The
# releases of the repository are immutable: no file can be attached once published.
# A tag with a suffix (v1.2.0-rc.1) gives a pre-release. "Run workflow" rebuilds the
# Docker image of an existing tag (its release, immutable, is left as is).
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v1.2.0)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  PRERELEASE: ${{ contains(inputs.tag || github.ref_name, '-') }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # A reused workflow gets at most the permissions of its caller: those of the CI
    # (publication of the image scan in the Security tab). The secret scan is in the
    # Security workflow: the released commit was scanned on main
    permissions:
      contents: read
      security-events: write

  release:
    name: Release archives
    # Published once the Docker image is available
    needs: [ci, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Build the archive
        run: |
          # carbure-1.2.0 for the tag 1.2.0 or v1.2.0
          name="carbure-${TAG#v}"
          mkdir -p dist build
          git archive --format=tar --prefix="$name/" HEAD \
            src portal swagger sql conf/prod.sample.ini tools/migrate.php README.md LICENSE \
            | tar -x -C build
          # Version shown in the footer of the portal and by /api/health
          echo "${TAG#v}" > "build/$name/VERSION"
          tar -czf "dist/$name.tar.gz" -C build "$name"
          (cd build && zip -qr "../dist/$name.zip" "$name")
          (cd dist && sha256sum -- * > SHA256SUMS)

      # gh creates a draft, uploads the archives, then publishes it: the release is
      # complete when it becomes immutable
      - name: Publish the release with its archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::The release $TAG already exists (immutable): left as is"
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --title "Carbure $TAG" --generate-notes --verify-tag "${flags[@]}"

  docker:
    name: Docker image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Docker Hub account: secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (access token
      # with Read & Write), image docker.io/ltoinel/carbure
      - name: Check the Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/ltoinel/carbure
          # 1.2.0 and v1.2.0 give the tags 1.2.0, 1.2 and latest (not for a pre-release)
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ env.PRERELEASE != 'true' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CARBURE_VERSION=${{ env.TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Bill of materials and build provenance attached to the image
          sbom: true
          provenance: mode=max

