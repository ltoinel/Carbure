# Release notes generated by GitHub ("Generate release notes"), grouped by the label
# of each pull request (see CONTRIBUTING.md)
changelog:
  categories:
    - title: 🔒 Security
      labels: [security]
    - title: ✨ Features
      labels: [enhancement]
    - title: 🐛 Fixes
      labels: [bug]
    - title: 📚 Documentation
      labels: [documentation]
    - title: 📦 Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
