version: 2
updates:
  # GitHub Actions — also keeps SHA-pinned actions up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Docker base images (php:8.3-fpm-alpine)
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"

  # Images referenced in docker-compose files
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: monthly
    commit-message:
      prefix: "docker"

  # End-to-end tests (portal)
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: monthly
    groups:
      e2e:
        patterns: ["*"]
    commit-message:
      prefix: "test"

  # MkDocs documentation
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    groups:
      docs:
        patterns: ["*"]
    commit-message:
      prefix: "docs"
