name: Feature request
description: Suggest a new feature or an improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea! French or English are both welcome.
        To discuss an idea before it becomes a feature, you can also start a [discussion](https://github.com/ltoinel/Carbure/discussions/categories/ideas).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that Carbure does not allow today?
      placeholder: I would like to…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would it work in the portal, the API or the iOS app?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today, or other solutions you considered.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to implement it (see [AGENTS.md](https://github.com/ltoinel/Carbure/blob/main/AGENTS.md) for the rules of the project)
